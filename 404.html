<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面不存在 · 转到书源生成器</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#F7F3EC; color:#1A1714;
         font:16px/1.7 "Songti SC","SimSun",Georgia,serif; }
  .box { max-width:420px; padding:32px 24px; text-align:center; }
  h1 { font-size:22px; margin:0 0 12px; color:#B23A2E; }
  p { margin:0 0 22px; color:#5A544D; }
  a { display:inline-block; min-height:44px; line-height:44px; padding:0 26px;
      background:#B23A2E; color:#fff; text-decoration:none; border-radius:6px;
      font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  a:focus-visible { outline:3px solid #1A1714; outline-offset:3px; }
</style>
</head>
<body>
  <div class="box">
    <h1>这个地址没有内容</h1>
    <p>你要找的页面不存在。回首页去生成书源文件吧。</p>
    <a href="./">回到书源生成器</a>
  </div>
  <script>
    // 直接把人送回去，省得手动点。
    setTimeout(function () { location.replace("./"); }, 2500);
  </script>
</body>
</html>
